<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 22 1000 278" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">ViGOR pipeline</title>
  <desc id="d">Surgical video is read frame by frame, grouped into action segments, described segment by segment in a first language model pass, then written into a draft operative note in a second pass.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect y="22" width="1000" height="278" fill="#f5f4f0"/>

  <!-- step titles -->
  <g font-size="15" fill="#1a1a1a">
    <text x="0" y="46"><tspan fill="#555">1</tspan><tspan dx="8" font-weight="500">Video</tspan></text>
    <text x="208" y="46"><tspan fill="#555">2</tspan><tspan dx="8" font-weight="500">Frames</tspan></text>
    <text x="416" y="46"><tspan fill="#555">3</tspan><tspan dx="8" font-weight="500">Action segments</tspan></text>
    <text x="624" y="46"><tspan fill="#555">4</tspan><tspan dx="8" font-weight="500">Pass 1: Observations</tspan></text>
    <text x="832" y="46"><tspan fill="#555">5</tspan><tspan dx="8" font-weight="500">Pass 2: Draft note</tspan></text>
  </g>

  <!-- nodes -->
  <g fill="#fff" stroke="#d4d4d0" stroke-width="1">
    <rect x="0" y="62" width="168" height="150" rx="6"/>
    <rect x="208" y="62" width="168" height="150" rx="6"/>
    <rect x="624" y="62" width="168" height="150" rx="6"/>
    <rect x="832" y="62" width="168" height="150" rx="6"/>
  </g>
  <rect x="416" y="62" width="168" height="150" rx="6" fill="#fff" stroke="#3399ff" stroke-width="2"/>

  <!-- arrows -->
  <g stroke="#555" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="174" y1="137" x2="202" y2="137"/>
    <line x1="382" y1="137" x2="410" y2="137"/>
    <line x1="590" y1="137" x2="618" y2="137"/>
    <line x1="798" y1="137" x2="826" y2="137"/>
  </g>

  <!-- 1 video: simple player -->
  <g>
    <rect x="29" y="99" width="110" height="76" rx="6" fill="#8a8a86"/>
    <path d="M74,120 L100,137 L74,154 z" fill="#f5f4f0"/>
  </g>

  <!-- 2 frames: grid -->
  <g transform="translate(0,-3)">
    <rect x="229" y="95" width="38" height="26" fill="#a3a39e"/><rect x="273" y="95" width="38" height="26" fill="#bdbdb8"/><rect x="317" y="95" width="38" height="26" fill="#8a8a86"/>
    <rect x="229" y="127" width="38" height="26" fill="#bdbdb8"/><rect x="273" y="127" width="38" height="26" fill="#a3a39e"/><rect x="317" y="127" width="38" height="26" fill="#cfcfca"/>
    <rect x="229" y="159" width="38" height="26" fill="#8a8a86"/><rect x="273" y="159" width="38" height="26" fill="#cfcfca"/><rect x="317" y="159" width="38" height="26" fill="#a3a39e"/>
  </g>

  <!-- 3 action segments: activity bar grouped into segments -->
  <g transform="translate(0,7)">
    <rect x="436" y="98" width="128" height="16" fill="#c0c2c4"/>
    <rect x="440" y="98" width="10" height="16" fill="#3399ff"/><rect x="454" y="98" width="14" height="16" fill="#3399ff"/>
    <rect x="490" y="98" width="8" height="16" fill="#3399ff"/><rect x="502" y="98" width="12" height="16" fill="#3399ff"/>
    <rect x="534" y="98" width="16" height="16" fill="#3399ff"/><rect x="554" y="98" width="6" height="16" fill="#3399ff"/>
    <g stroke="#555" stroke-width="1" fill="none">
      <path d="M440,120 v6 h28 v-6"/><path d="M490,120 v6 h24 v-6"/><path d="M534,120 v6 h26 v-6"/>
    </g>
    <g fill="#3399ff">
      <rect x="436" y="140" width="36" height="22" rx="11"/><rect x="482" y="140" width="36" height="22" rx="11"/><rect x="528" y="140" width="36" height="22" rx="11"/>
    </g>
    <g font-size="11" fill="#fff" text-anchor="middle" font-weight="500">
      <text x="454" y="155">#0</text><text x="500" y="155">#1</text><text x="546" y="155">#2</text>
    </g>
  </g>

  <!-- 4 pass 1: per-segment card -->
  <g>
    <rect x="642" y="84" width="132" height="22" rx="11" fill="#3399ff"/>
    <text x="654" y="99" font-size="11" fill="#fff" font-weight="500">#0 Margin marking</text>
    <g font-size="11" fill="#1a1a1a">
      <text x="642" y="128">Instruments</text>
      <text x="642" y="156">Anatomy</text>
      <text x="642" y="184">Action</text>
    </g>
    <g fill="#d4d4d0">
      <rect x="642" y="133" width="112" height="5" rx="2.5"/>
      <rect x="642" y="161" width="96" height="5" rx="2.5"/>
      <rect x="642" y="189" width="124" height="5" rx="2.5"/>
    </g>
  </g>

  <!-- 5 pass 2: note with citations -->
  <g transform="translate(0,-7)">
    <g fill="#d4d4d0">
      <rect x="850" y="88" width="132" height="5" rx="2.5"/>
      <rect x="850" y="102" width="98" height="5" rx="2.5"/>
      <rect x="850" y="126" width="132" height="5" rx="2.5"/>
      <rect x="850" y="140" width="120" height="5" rx="2.5"/>
      <rect x="850" y="154" width="84" height="5" rx="2.5"/>
      <rect x="850" y="178" width="132" height="5" rx="2.5"/>
      <rect x="850" y="192" width="70" height="5" rx="2.5"/>
    </g>
    <g fill="#e3effd" stroke="#3399ff" stroke-width="1">
      <rect x="952" y="97" width="26" height="14" rx="3"/>
      <rect x="938" y="149" width="26" height="14" rx="3"/>
      <rect x="924" y="187" width="26" height="14" rx="3"/>
    </g>
    <g font-size="9" fill="#3399ff" text-anchor="middle" font-weight="600">
      <text x="965" y="107">#0</text><text x="951" y="159">#1</text><text x="937" y="197">#2</text>
    </g>
  </g>

  <!-- model labels -->
  <g font-size="12" fill="#555">
    <text x="0" y="234">Robotic surgical video</text>
    <text x="208" y="234">DINOv3 vision encoder</text>
    <text x="416" y="234">MS-TCN temporal model,</text>
    <text x="416" y="250">trained on surgeon labels</text>
    <text x="624" y="234">Each segment on its own</text>
    <text x="832" y="234">Whole case, surgeon's voice</text>
  </g>
  <path d="M624,262 v8 h376 v-8" fill="none" stroke="#555" stroke-width="1"/>
  <text x="812" y="290" font-size="12" fill="#555" text-anchor="middle">Vision-language model, two passes</text>
</svg>
